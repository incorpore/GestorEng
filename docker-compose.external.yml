# Struvia — somente a APLICAÇÃO (API + worker + web), usando PostgreSQL e Redis
# que já rodam em outros containers (ex.: ZimaOS / Portainer).
#
# 1) Crie o banco no seu Postgres 16+:  CREATE DATABASE struvia; CREATE USER struvia WITH PASSWORD '...'; ALTER DATABASE struvia OWNER TO struvia;
# 2) No .env defina DATABASE_URL, (opcional) REDIS_URL e EXTERNAL_NETWORK (rede Docker onde estão o Postgres/Redis)
# 3) docker compose -f docker-compose.external.yml up -d
name: struvia

x-app: &app
  image: ${IMAGE_API:-struvia/api:local}
  build: ./backend
  pull_policy: ${PULL_POLICY:-build}
  restart: unless-stopped
  env_file: .env
  environment:
    ENVIRONMENT: production
    DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (postgresql+psycopg://usuario:senha@host:5432/banco)}
    REDIS_URL: ${REDIS_URL:-}
    STORAGE_DIR: /data/storage
  volumes:
    - ${STORAGE_PATH:-storage}:/data/storage
  networks: [backend, infra]
  read_only: true
  tmpfs: ["/tmp:mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  api:
    <<: *app
    command: ["api"]

  worker:
    <<: *app
    command: ["worker"]
    healthcheck: { disable: true }
    depends_on: [api]

  web:
    image: ${IMAGE_WEB:-struvia/web:local}
    build: ./frontend
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
      MAX_BODY: ${MAX_UPLOAD_MB:-25}m
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:mode=1777", "/etc/nginx/conf.d:mode=1777", "/var/cache/nginx:mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  storage:

networks:
  backend:
  infra:
    name: ${EXTERNAL_NETWORK:-infra}
    external: true
