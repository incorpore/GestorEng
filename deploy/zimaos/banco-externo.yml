# GestorEng — ZimaOS · BANCO EXTERNO (PostgreSQL e Redis já existentes na rede)
# Troque todos os valores TROQUE_*. As variáveis de "api" e "worker" devem ser IGUAIS.
# Redis é opcional: para não usar, apague as linhas REDIS_* de "api" e "worker".
# Senhas podem ter qualquer caractere — o sistema codifica sozinho. Chaves: openssl rand -hex 32
name: gestoreng
services:
  api:
    container_name: gestoreng-api
    image: ghcr.io/incorpore/gestoreng-api:latest
    restart: unless-stopped
    command:
      - api
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: 192.168.3.100
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gestoreng
      POSTGRES_USER: gestoreng
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      REDIS_HOST: 192.168.3.100
      REDIS_PORT: "6379"
      REDIS_PASSWORD: TROQUE_SENHA_DO_REDIS
      REDIS_DB: "0"
      REDIS_PREFIX: GestorEng_
      SECRET_KEY: TROQUE_CHAVE_1
      ENCRYPTION_KEY: TROQUE_CHAVE_2
      ADMIN_EMAIL: admin@velmont.com.br
      ADMIN_PASSWORD: TROQUE_Senha@Forte2026
      ADMIN_NAME: Administrador
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://192.168.3.100:8917,https://localhost,capacitor://localhost
      MAX_UPLOAD_MB: "50"
      TZ: America/Sao_Paulo
      WEB_CONCURRENCY: "3"
      STORAGE_DIR: /data/storage
    volumes:
      - type: bind
        source: /media/URSUS/AppData/GestorEng/storage
        target: /data/storage
    networks:
      - gestoreng
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    container_name: gestoreng-worker
    image: ghcr.io/incorpore/gestoreng-api:latest
    restart: unless-stopped
    command:
      - worker
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: 192.168.3.100
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gestoreng
      POSTGRES_USER: gestoreng
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      REDIS_HOST: 192.168.3.100
      REDIS_PORT: "6379"
      REDIS_PASSWORD: TROQUE_SENHA_DO_REDIS
      REDIS_DB: "0"
      REDIS_PREFIX: GestorEng_
      SECRET_KEY: TROQUE_CHAVE_1
      ENCRYPTION_KEY: TROQUE_CHAVE_2
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://192.168.3.100:8917,https://localhost,capacitor://localhost
      MAX_UPLOAD_MB: "50"
      TZ: America/Sao_Paulo
      STORAGE_DIR: /data/storage
    volumes:
      - type: bind
        source: /media/URSUS/AppData/GestorEng/storage
        target: /data/storage
    depends_on:
      - api
    healthcheck:
      disable: true
    networks:
      - gestoreng
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    container_name: gestoreng-web
    image: ghcr.io/incorpore/gestoreng-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
      MAX_BODY: 50m
    ports:
      - target: 8080
        published: "8917"
        protocol: tcp
    depends_on:
      - api
    networks:
      - gestoreng
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  gestoreng:
    name: gestoreng
    driver: bridge

x-casaos:
  author: Velmont
  category: Productivity
  description:
    custom: Sistema de Gestão de Engenharia — obras, licitações, financeiro e documentos
  index: /
  main: web
  port_map: "8917"
  scheme: http
  title:
    custom: GestorEng
