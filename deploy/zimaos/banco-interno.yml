# Struvia — ZimaOS · BANCO INTERNO (PostgreSQL + Redis instalados junto com o app)
# Troque todos os valores TROQUE_*. As variáveis de "api" e "worker" devem ser IGUAIS.
# POSTGRES_PASSWORD deve ser igual em "db", "api" e "worker"; a senha do Redis igual no "command" do redis e em REDIS_PASSWORD.
# Senhas podem ter qualquer caractere — o sistema codifica sozinho. Chaves: openssl rand -hex 32
name: struvia
services:
  db:
    container_name: struvia-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: struvia
      POSTGRES_USER: struvia
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: /media/URSUS/AppData/Struvia/postgres
        target: /var/lib/postgresql/data
    networks:
      - struvia
    security_opt:
      - no-new-privileges:true

  redis:
    container_name: struvia-redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - TROQUE_SENHA_DO_REDIS
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - struvia
    security_opt:
      - no-new-privileges:true

  api:
    container_name: struvia-api
    image: ghcr.io/incorpore/struvia-api:latest
    restart: unless-stopped
    command:
      - api
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: struvia
      POSTGRES_USER: struvia
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: TROQUE_SENHA_DO_REDIS
      REDIS_DB: "0"
      REDIS_PREFIX: Struvia_
      SECRET_KEY: TROQUE_CHAVE_1
      ENCRYPTION_KEY: TROQUE_CHAVE_2
      ADMIN_EMAIL: admin@velmont.com.br
      ADMIN_PASSWORD: TROQUE_Senha@Forte2026
      ADMIN_NAME: Administrador
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://192.168.3.100:8917,https://localhost,capacitor://localhost
      MAX_UPLOAD_MB: "50"
      TZ: America/Sao_Paulo
      WEB_CONCURRENCY: "3"
      STORAGE_DIR: /data/storage
    volumes:
      - type: bind
        source: /media/URSUS/AppData/Struvia/storage
        target: /data/storage
    depends_on:
      - db
      - redis
    networks:
      - struvia
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

  worker:
    container_name: struvia-worker
    image: ghcr.io/incorpore/struvia-api:latest
    restart: unless-stopped
    command:
      - worker
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: struvia
      POSTGRES_USER: struvia
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: TROQUE_SENHA_DO_REDIS
      REDIS_DB: "0"
      REDIS_PREFIX: Struvia_
      SECRET_KEY: TROQUE_CHAVE_1
      ENCRYPTION_KEY: TROQUE_CHAVE_2
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://192.168.3.100:8917,https://localhost,capacitor://localhost
      MAX_UPLOAD_MB: "50"
      TZ: America/Sao_Paulo
      STORAGE_DIR: /data/storage
    volumes:
      - type: bind
        source: /media/URSUS/AppData/Struvia/storage
        target: /data/storage
    depends_on:
      - api
    healthcheck:
      disable: true
    networks:
      - struvia
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

  web:
    container_name: struvia-web
    image: ghcr.io/incorpore/struvia-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
      MAX_BODY: 50m
    ports:
      - target: 8080
        published: "8917"
        protocol: tcp
    depends_on:
      - api
    networks:
      - struvia
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  struvia:
    name: struvia
    driver: bridge

x-casaos:
  author: Velmont
  category: Productivity
  description:
    custom: Sistema de Gestão de Engenharia — obras, licitações, financeiro e documentos
  index: /
  main: web
  port_map: "8917"
  scheme: http
  title:
    custom: Struvia
