# GestorEng — instalação COMPLETA (PostgreSQL + Redis + API + worker + web)
# Uso:  cp .env.example .env  &&  (edite)  &&  docker compose up -d
name: gestoreng

x-app: &app
  image: ${IMAGE_API:-gestoreng/api:local}
  build: ./backend
  pull_policy: ${PULL_POLICY:-build}
  restart: unless-stopped
  env_file: .env
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gestoreng}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gestoreng}
    REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [backend]
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestoreng}
      POSTGRES_USER: ${POSTGRES_USER:-gestoreng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    read_only: true
    security_opt: [no-new-privileges:true]

  api:
    <<: *app
    command: ["api"]

  worker:
    <<: *app
    command: ["worker"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_started }

  web:
    image: ${IMAGE_WEB:-gestoreng/web:local}
    build: ./frontend
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
      MAX_BODY: ${MAX_UPLOAD_MB:-25}m
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp, /etc/nginx/conf.d, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  pgdata:
  storage:

networks:
  backend:
